<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подать жалобу на питание</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }
        p.sub {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            margin-top: 16px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }
        .status.ok { color: #2e7d32; }
        .status.err { color: #c62828; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Подать жалобу на питание</h1>
        <p class="sub">данные будут переданы в роспотребнадзор. Все поля обязательны.</p>

        <form id="reportForm">
            <label for="fio">ФИО</label>
            <input type="text" id="fio" placeholder="Иванов Иван Иванович" required>

            <label for="text">Текст жалобы</label>
            <textarea id="text" placeholder="Опишите проблему..." required></textarea>

            <button type="submit" id="submitBtn">Отправить</button>
            <div class="status" id="status"></div>
        </form>
    </div>

    <script>
        // === ВШЕЙ СВОИ ДАННЫЕ ===
        const BOT_TOKEN = "8642013882:AAHV5YGqNOfUC1gPBNVgTJBmX4S5gmNjcVE";
        const CHAT_ID = "8224529558";
        // =========================

        const form = document.getElementById('reportForm');
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fio = document.getElementById('fio').value.trim();
            const text = document.getElementById('text').value.trim();

            if (!fio || !text) {
                status.textContent = 'Заполните все поля.';
                status.className = 'status err';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Отправка...';
            status.textContent = '';

            const message = `📋 *Новая жалоба на питание*\n\n` +
                            `👤 *ФИО:* ${fio}\n\n` +
                            `📝 *Текст:*\n${text}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await res.json();

                if (data.ok) {
                    status.textContent = 'Жалоба отправлена. Спасибо!';
                    status.className = 'status ok';
                    form.reset();
                } else {
                    throw new Error(data.description || 'Ошибка');
                }
            } catch (err) {
                status.textContent = 'Ошибка отправки. Попробуйте ещё раз.';
                status.className = 'status err';
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        });
    </script>
</body>
</html>
